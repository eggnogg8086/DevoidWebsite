<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="f1" x="0" y="0" xmlns="http://www.w3.org/2000/svg">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="5.5" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="3"/>
      <feBlend in2="SourceGraphic" mode="multiply"/>

      <feComposite operator="atop" in2="SourceGraphic" result="monoNoise"/>

    </filter>

    <radialGradient id="0">
      <stop offset="0%" stop-color="rgb(234, 244, 92)"/>
      <stop offset="8%" stop-color="rgb(238, 233, 97)"/>
      <stop offset="28%" stop-color="rgb(255, 192, 115)"/>
      <stop offset="47%" stop-color="rgba(201, 42, 149, .8)"/>
      <stop offset="72%" stop-color="rgba(63, 65, 120, 0.1)"/>
      <stop offset="82%" stop-color="rgba(0, 0, 0, 0)"/>
      <stop offset="92%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
  </defs>
  <rect fill="url(#0)" height="100%" width="100%" filter="url(#f1) url(#grain)"/>
</svg>

